name: check-requirements

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements-docs.txt"
      - "scripts/generate_requirements.sh"
      - ".github/workflows/check-requirements.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements-docs.txt"
      - "scripts/generate_requirements.sh"
      - ".github/workflows/check-requirements.yml"

permissions:
  contents: read

jobs:
  check-requirements-in-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install "pip-tools>=7.4.1"

      # `git diff` reports nothing for a path git is not tracking, so an
      # uncommitted requirements file would make the drift check below pass
      # unconditionally. That is exactly how this job silently passed while
      # requirements.txt was never committed, so assert tracking first.
      - name: Assert the requirements files are tracked
        run: |
          for file in requirements.txt requirements-dev.txt requirements-docs.txt; do
            if ! git ls-files --error-unmatch "$file" > /dev/null 2>&1; then
              echo "::error::$file is not tracked by git, so drift in it cannot be detected. Run ./scripts/generate_requirements.sh and commit the result."
              exit 1
            fi
          done
          echo "Both requirements files are tracked."

      - name: Regenerate the requirements files
        run: scripts/generate_requirements.sh

      - name: Check for drift and report
        run: |
          drift=0
          for file in requirements.txt requirements-dev.txt requirements-docs.txt; do
            if ! git diff --quiet -- "$file"; then
              echo "::group::$file is out of sync, diff below"
              git diff -- "$file"
              echo "::endgroup::"
              echo "::error::$file is out of sync with pyproject.toml. Fix locally with: ./scripts/generate_requirements.sh && git add $file && git commit"
              drift=1
            else
              echo "$file is in sync."
            fi
          done
          exit "$drift"

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      # Every docstring under src/ is rendered into the API reference, and
      # docs/source/conf.py imports and walks the whole package to decide
      # which classes get :inherited-members:. A source-only change can
      # therefore break the docs on its own.
      - "src/call_report/**"
      - "pyproject.toml"
      # This job exists to catch what the Read the Docs build would catch,
      # so a change to how RTD builds needs to re-run it.
      - ".readthedocs.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        # Matches build.tools.python in .readthedocs.yaml, so a failure here
        # means the hosted build fails too.
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The three dataframe backends are here for the doctest step below,
      # not for the html build. The User Guide's examples load real frames,
      # and every backend appears in dataframe_backends.rst. They are
      # deliberately not added to the `docs` extra: Read the Docs installs
      # that extra and only builds html, which imports no backend, so
      # putting them there would slow every hosted build for nothing.
      - name: Install package with docs dependencies
        run: pip install -e ".[docs,pandas,polars,pyarrow]"

      - name: Show dependencies
        run: python -m pip list

      # -W matches `sphinx.fail_on_warning: true` in .readthedocs.yaml, so
      # a numpydoc validation failure, an autodoc import error, malformed
      # reStructuredText, or a toctree problem fails the job instead of
      # scrolling past. --keep-going reports every warning in one run
      # rather than stopping at the first.
      #
      # An unresolved Python cross-reference is caught too, but by
      # `nitpicky = True` in conf.py rather than by anything here. It lives
      # there so Read the Docs enforces it as well; -n on this line would
      # leave the hosted build unguarded. See issue #53.
      #
      # conf.py's intersphinx_mapping fetches four external inventories
      # (python, pandas, polars, pyarrow) on every build, and an unreachable
      # host is a warning -- so with -W, an outage at one of them fails this
      # job for reasons unrelated to the pull request. Re-run the job to
      # confirm before looking for a real cause.
      - name: Build the documentation
        run: sphinx-build -b html -W --keep-going docs/source docs/_build/html

      # Executes the User Guide's `.. doctest::` blocks against the real
      # package. Docstring examples are covered by pytest's
      # --doctest-modules; narrative prose was covered by nothing, so a
      # return value, dtype, or column order could change and leave the
      # documentation quietly wrong.
      #
      # This runs here and not on Read the Docs. RTD installs
      # non-editably (.readthedocs.yaml: method pip, path .), and
      # PackagedArchiveTransport locates data/fca-call-report relative to
      # the package's own file, which only resolves to the repository from
      # an editable install. RTD builds html, which never executes these
      # blocks, so that stays fine -- but do not add a doctest builder
      # there.
      - name: Run the documentation's doctests
        run: sphinx-build -b doctest docs/source docs/_build/doctest

      # Lets a reviewer read the rendered result even on a fork pull
      # request, where the Read the Docs preview is not available.
      - name: Upload the rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

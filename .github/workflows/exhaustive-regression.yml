name: exhaustive-regression

# Loads every archived FCA release against every dataframe backend, and
# compares all three backends value-for-value on every release. That is the
# full cross product the pull-request suite deliberately samples, so it is
# minutes of work rather than seconds and never runs on an ordinary pull
# request.
#
# Triggers:
#   pull_request       runs on a pull request from a `release/*` branch, and
#                      on any pull request carrying the `run-exhaustive`
#                      label. Both gate the merge, so a release or a new
#                      quarter of archive data is covered before it reaches
#                      main rather than after.
#   workflow_dispatch  run it by hand from the Actions tab, against any ref.
#
# `labeled` has to be in `types`, or adding the label to an open pull
# request would not start a run. There is no `paths` filter: a release pull
# request bumps only `__init__.py`, which no useful filter would match.
on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to run against"
        required: false
        default: "3.12"
      os:
        description: "Runner to use"
        required: false
        default: "ubuntu-latest"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: exhaustive-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exhaustive:
    name: exhaustive archive regression
    # A pull request opts in one of two ways: it comes from a `release/*`
    # branch, or it carries the `run-exhaustive` label. The branch prefix
    # makes the release case automatic. The label covers everything else,
    # most usefully a pull request adding a quarter's archive to `data/`.
    # A manual dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'run-exhaustive')
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    # The full cross product across ~105 releases is long-running by design.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version || '3.12' }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Confirm the archive is present
        # The regression is only meaningful against real release zips. The
        # test fixture skips when they are absent, and a silently skipped
        # exhaustive run would be worse than a failed one.
        run: |
          count=$(find data/fca-call-report -name '*.zip' | wc -l)
          echo "Found $count archived release zips."
          if [ "$count" -eq 0 ]; then
            echo "::error::No archived FCA release zips found under data/fca-call-report."
            exit 1
          fi

      - name: Run the exhaustive regression
        # Selected by marker across the whole suite rather than by naming a
        # test file. Any module that marks a test `exhaustive` is picked up
        # here automatically, instead of this step needing an edit each time
        # one is added -- a new exhaustive test that silently never runs in
        # the job built to run it would be worse than no test at all.
        run: |
          python -m pytest tests \
            --run-exhaustive \
            -m exhaustive \
            -p no:randomly \
            -v \
            --durations=25

name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - run: pip install build

      - run: pip install -e .

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "from call_report import __version__; print(__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package __version__ ($PKG_VERSION). Did you forget to bump __version__ before tagging?"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches package version $PKG_VERSION"

      - run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # OIDC Trusted Publishing: PyPI exchanges this job's short-lived OIDC
    # token for a scoped upload credential, so no PyPI API token secret is
    # needed here. Requires a one-time "trusted publisher" entry registered
    # on the PyPI project settings for this repo, workflow filename, and
    # the "pypi" environment below.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The dev extra already includes the pandas/polars/pyarrow backends
      # (see pyproject.toml), so dev + docs installs the same package union
      # the old requirements.txt/-dev.txt/-docs.txt trio covered together.
      - name: Install package with dev and docs dependencies
        run: pip install -e ".[dev,docs]"

      # No `inputs:` here, unlike a requirements-file audit. With none
      # given, this action audits the environment's installed
      # distributions directly, so it sees the full resolved package set,
      # transitive dependencies included, exactly as pip actually resolved
      # it just now rather than a separately maintained, driftable pin.
      - name: Audit dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@v1.1.0

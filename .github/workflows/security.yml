name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install "pip-tools>=7.4.1"

      - name: Regenerate the requirements files
        run: scripts/generate_requirements.sh

      - name: Audit dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # All three groups. Their union is every extra, so this scans the
          # same package set a single --all-extras file would.
          inputs: >-
            requirements.txt
            requirements-dev.txt
            requirements-docs.txt

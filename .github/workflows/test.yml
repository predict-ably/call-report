name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/call_report/**"
      # A change to the tests themselves must run the tests. Without this,
      # a test-only pull request is type-checked (mypy.yml already lists
      # tests/**) but the suite never actually runs on it.
      - "tests/**"
      # tests/fca/test_release_archive.py regression-tests every release zip
      # checked in here, so adding a quarter's archive needs the suite too.
      - "data/**"
      - ".github/workflows/**"
      - "pyproject.toml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


jobs:
  pytest:
    # Spelled out so the 12 polars-latest jobs keep the names that branch
    # protection may list as required checks. Only the pinned job gets a
    # polars suffix.
    name: >-
      pytest (${{ matrix.os }}, ${{ matrix.python-version }}${{
      matrix.polars != 'latest' && format(', polars {0}', matrix.polars) || '' }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # "latest" must be a base matrix value. Without it, the include
        # entry below would merge into the existing ubuntu 3.12 job instead
        # of adding a new one.
        polars: ["latest"]
        include:
          # The floor declared in pyproject.toml (polars>=1.0). polars does
          # not differ by OS or Python here, so one job covers the 1.x major.
          - os: ubuntu-latest
            python-version: "3.12"
            polars: "1.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        if: matrix.polars == 'latest'
        run: pip install -e ".[dev]"

      # The pin goes in the same resolve as the dev dependencies, so a
      # dependency that needs a newer polars fails the install loudly.
      - name: Install package with dev dependencies and pinned polars
        if: matrix.polars != 'latest'
        env:
          POLARS_VERSION: ${{ matrix.polars }}
        run: pip install -e ".[dev]" "polars==${POLARS_VERSION}"

      - name: Check the polars version
        if: matrix.polars != 'latest'
        env:
          EXPECTED_POLARS: ${{ matrix.polars }}
        run: >-
          python -c "import os, polars;
          assert polars.__version__ == os.environ['EXPECTED_POLARS'],
          polars.__version__"

      - name: Show dependencies
        run: python -m pip list

      - name: Run tests
        run: pytest --cov=call_report --cov-report=xml --cov-report=term-missing --cov-fail-under=100

      - name: Upload coverage to Codecov
        if: >-
          matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
          && matrix.polars == 'latest'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true

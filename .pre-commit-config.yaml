repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: requirements-txt-fixer
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^src/
        # Deliberately narrow, unlike this project's own dev/CI test envs:
        # pre-commit.ci caps a hook environment at 250MiB, and pyarrow +
        # polars's compiled runtime (polars-runtime-32) alone are >100MiB of
        # wheels before unpacking -- pulling in the full dataframe stack
        # here blew that budget (570MiB observed). pandas/pandas-stubs stay
        # since they're small (pandas-stubs only pulls numpy, not pandas
        # itself). pyarrow-stubs isn't a true stub-only package -- its own
        # metadata requires real pyarrow -- so pa.Table/pl.DataFrame/
        # pl.LazyFrame resolve to Any in *this hook only* (mirrors-mypy's
        # default --ignore-missing-imports masks them without erroring);
        # full precision for all four backends still applies wherever it
        # matters -- local `mypy` runs against the dev extras, and this
        # project's real test matrix in .github/workflows/test.yml.
        additional_dependencies:
          - narwhals>=1.0
          - pandas>=2.0
          - pandas-stubs>=2.0

  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0rc0
    hooks:
      - id: numpydoc-validation
        exclude: |
          (?x)(
              (^|/)tests/|
              /__init__\.py$
          )

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types_or: [python, markdown]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        files: \.(rst|md|markdown|tex)$

  - repo: https://github.com/PyCQA/doc8
    rev: v2.0.0
    hooks:
      - id: doc8

  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.2
    hooks:
      - id: sphinx-lint

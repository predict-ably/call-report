version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
  # Matches the `-W` that .github/workflows/docs.yml builds with, so the
  # hosted build and the pull request check agree on what passing means.
  fail_on_warning: true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-report"
dynamic = ["version"]
description = "Tools for working with regulatory call report data filed by regulated U.S. financial institutions."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "RNKuhns", email = "rnkuhns@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/call_report"]

[tool.hatch.version]
path = "src/call_report/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TID", "N", "A", "S", "T20", "PTH", "RUF", "D", "Q"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["call_report"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pydocstyle]
convention = "numpy"

[tool.numpydoc_validation]
checks = ["all", "GL01", "SA01", "EX01"]
exclude = [
    "^test_",
    "\\.test_",
    "\\.__init__$",
]

[tool.doc8]
max-line-length = 88
ignore_path = ["docs/_build"]

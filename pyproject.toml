[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-report"
dynamic = ["version"]
description = "Tools for working with regulatory call report data filed by regulated U.S. financial institutions."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "RNKuhns", email = "rnkuhns@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "narwhals>=1.0",
]

[project.optional-dependencies]
# pandas-stubs/pyarrow-stubs are included here, not just in dev, because
# call_report ships a py.typed marker and neither pandas nor pyarrow ships
# its own (confirmed: no py.typed in either installed distribution) --
# without the stub package, a downstream user's own mypy run resolves
# call_report's pandas/pyarrow-typed return values as Any instead of
# pd.DataFrame/pa.Table. polars ships py.typed itself, so it needs nothing
# extra.
pandas = ["pandas>=2.0", "pandas-stubs>=2.0"]
polars = ["polars>=1.0"]
pyarrow = ["pyarrow>=15.0", "pyarrow-stubs>=20.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "packaging>=24.0",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pandas-stubs>=2.0",
    "pyarrow-stubs>=20.0",
]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "numpydoc>=1.7",
    "sphinx-copybutton",
    "sphinx-design>=0.5",
    "sphinx-issues",
]

[tool.hatch.build.targets.wheel]
packages = ["src/call_report"]

[tool.hatch.version]
path = "src/call_report/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TID", "N", "A", "S", "T20", "PTH", "RUF", "D", "Q"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"docs/source/conf.py" = ["A001"]

[tool.ruff.lint.isort]
known-first-party = ["call_report"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.coverage.run]
source = ["call_report"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod"
]

[tool.mypy]
# Kept at the lowest version this project's mypy config needs to parse
# third-party stubs cleanly, not at the lowest version it actually runs on
# (that's requires-python/the .github/workflows/test.yml matrix, which
# covers 3.11-3.14 with real interpreters and is the authoritative
# compatibility gate). numpy's bundled __init__.pyi started using PEP 695
# `type` statements (3.12+ only) in every release still installable on
# newer Pythons; mypy refuses to *parse* that syntax below 3.12 even in
# stubs it's merely reading through, with no per-module override able to
# rescue a parse-stage failure. 3.11 itself is unaffected either way.
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pydocstyle]
convention = "numpy"

[tool.numpydoc_validation]
checks = ["all", "GL01", "SA01", "EX01"]
exclude = [
    "^test_",
    "\\.test_",
    "\\.__init__$",
]

[tool.doc8]
max-line-length = 88
ignore_path = ["docs/_build"]
